<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Daily Checklist Hub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Daily Checklist Hub</h1>
        <div class="muted">Stay focused — plan, track, and reflect.</div>
      </div>
      <div class="row">
        <label class="switch">
          <input id="darkModeToggle" type="checkbox" />
          <span>Dark</span>
        </label>
        <div class="card compact">
          <div id="progressCount">0/0 tasks complete</div>
          <div id="progressWrap">
            <div class="progress-bar"><div id="progressBarFill"></div></div>
            <div id="progressLabel">0%</div>
          </div>
        </div>
      </div>
    </header>

    <!-- Global add form -->
    <div id="globalAddTaskForm" class="card">
      <div class="form-inline">
        <select id="globalCategory" class="small-input">
          <option>Morning Routine</option>
          <option>Top 3 Priorities</option>
          <option>Focus Blocks</option>
          <option>Homework/Tasks</option>
          <option>Environment Reset</option>
          <option>Health</option>
          <option>Evening Review</option>
        </select>
        <input id="globalTaskText" class="small-input" type="text" placeholder="Add a task quickly..." />
        <button id="globalAddBtn" class="btn">Add Task</button>
      </div>
    </div>

    <div class="layout">
      <main class="left">
        <div id="tasksContainer" class="card">
          <!-- JS will populate task categories and tasks here -->
        </div>

        <div class="card" id="prioritiesContainer">
          <!-- Top 3 priorities UI inserted by JS -->
        </div>

        <section class="card" id="eveningReviewContainer">
          <!-- Evening review content rendered by JS -->
        </section>

        <section class="card">
          <h3>Brain Dump</h3>
          <textarea id="brainDumpTextarea" rows="6" class="textarea"></textarea>
          <div class="controls">
            <button id="brainDumpSave" class="btn">Save Notes</button>
            <button id="brainDumpClear" class="btn tiny">Clear</button>
          </div>
        </section>
      </main>

      <aside class="right">
        <div class="card">
          <h3>Activation (5 min)</h3>
          <div id="activationTimerDisplay" class="timer-display">05:00</div>
          <div class="controls">
            <button id="activationStart" class="btn small">Start</button>
            <button id="activationPause" class="btn small">Pause</button>
            <button id="activationReset" class="btn small">Reset</button>
          </div>
          <div id="activationMessage" class="muted mt-8"></div>
        </div>

        <div class="card">
          <h3>Focus Timer</h3>
          <div id="focusModeLabel" class="section-label">Focus</div>
          <div id="focusTimerDisplay" class="timer-display">45:00</div>
          <div class="controls">
            <button id="focusStart" class="btn small">Start</button>
            <button id="focusPause" class="btn small">Pause</button>
            <button id="focusReset" class="btn small">Reset</button>
          </div>
        </div>

        <div class="card">
          <h3>Mood</h3>
          <div id="moodContainer"></div>
        </div>

        <div class="card">
          <h3>Health</h3>
          <div class="health-row">
            <div>Water: <strong id="waterCount">0</strong></div>
            <button id="waterAdd" class="btn tiny">+1</button>
            <button id="waterReset" class="btn tiny">Reset</button>
          </div>
          <div class="health-row">
            <label><input id="exerciseChk" type="checkbox" /> Exercise</label>
            <label><input id="medsChk" type="checkbox" /> Medication</label>
          </div>
          <div class="health-row">
            <input id="bloodSugarInput" class="small-input" placeholder="Blood sugar" />
            <button id="saveHealthBtn" class="btn tiny">Save</button>
          </div>
        </div>

        <div class="card" id="achievementsContainer">
          <!-- Achievements rendered by JS -->
        </div>
      </aside>
    </div>

    <footer class="muted">
      Built with your app.js — elements above match the expected IDs. Add CSS/markup tweaks as needed.
    </footer>
  </div>

  <!-- Link to the app script you provided. Adjust path if needed. -->
  <script src="app.js"></script>
  <script>
    // small helper to prevent form submit jumps if the user presses Enter in the top input
    const globalFormText = document.getElementById('globalTaskText');
    if (globalFormText) {
      globalFormText.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const btn = document.getElementById('globalAddBtn');
          if (btn) btn.click();
        }
      });
    }

    // Ensure dark mode toggle applies the .dark-mode class to <body>
    const darkToggle = document.getElementById('darkModeToggle');
    if (darkToggle) {
      darkToggle.addEventListener('change', (e) => {
        document.body.classList.toggle('dark-mode', e.target.checked);
      });
    }
  </script>
</body>
</html>
