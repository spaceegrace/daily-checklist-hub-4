<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Daily Checklist Hub — Tasks Only</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Daily Checklist Hub</h1>
        <div class="muted">Stay focused — plan, track, and reflect.</div>
      </div>
      <div class="row">
        <label class="switch">
          <input id="darkModeToggle" type="checkbox" />
          <span>Dark</span>
        </label>
        <div class="card compact">
          <div id="progressCount">0/0 tasks complete</div>
          <div id="progressWrap">
            <div class="progress-bar"><div id="progressBarFill"></div></div>
            <div id="progressLabel">0%</div>
          </div>
        </div>
      </div>
    </header>

    <!-- Global add form -->
    <div id="globalAddTaskForm" class="card">
      <div class="form-inline">
        <select id="globalCategory" class="small-input">
          <option>Morning Routine</option>
          <option>Top 3 Priorities</option>
          <option>Focus Blocks</option>
          <option>Homework/Tasks</option>
          <option>Environment Reset</option>
        </select>
        <input id="globalTaskText" class="small-input" type="text" placeholder="Add a task quickly..." />
        <button id="globalAddBtn" class="btn">Add Task</button>
      </div>
    </div>

    <main class="card" style="margin-top:12px;">
      <div id="tasksContainer">
        <!-- JS will populate task categories and tasks here -->
      </div>

      <!-- Evening Review: shows tasks completed today -->
      <section id="eveningReviewCard" class="card mt-8">
        <div class="section-header">
          <h3 class="section-label">Evening Review — Completed Today</h3>
          <div class="controls">
            <button id="resetDayBtn" class="btn danger">Reset Day (Delete completed today)</button>
            <button id="clearAllBtn" class="btn danger">Clear All (Delete all tasks)</button>
          </div>
        </div>
        <div id="eveningReview">
          <!-- populated by JS -->
        </div>
      </section>

    </main>

    <footer class="muted">
      Focused view: tasks + completed section. Extra widgets removed for clarity.
    </footer>
  </div>

  <script src="app.js"></script>
  <script>
    // small helper to prevent form submit jumps if the user presses Enter in the top input
    const globalFormText = document.getElementById('globalTaskText');
    if (globalFormText) {
      globalFormText.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const btn = document.getElementById('globalAddBtn');
          if (btn) btn.click();
        }
      });
    }

    // Ensure dark mode toggle applies the .dark-mode class to <body>
    const darkToggle = document.getElementById('darkModeToggle');
    if (darkToggle) {
      darkToggle.addEventListener('change', (e) => {
        document.body.classList.toggle('dark-mode', e.target.checked);
        try {
          const raw = localStorage.getItem('dailyChecklistData');
          const state = raw ? JSON.parse(raw) : null;
          if (state && state.settings) {
            state.settings.darkMode = e.target.checked;
            localStorage.setItem('dailyChecklistData', JSON.stringify(state));
          }
        } catch (err) {
          // ignore
        }
      });
    }
  </script>
</body>
</html>
